name: Daily Morning Market Briefing Crawler

on:
  schedule:
    # 00:00 UTC = 09:00 KST (Every day)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Crawler
        run: |
          python scripts/market_crawler.py

      - name: Commit and Push Updated Market Data
        run: |
          git config --global user.name 'ALPHA-Market-Bot'
          git config --global user.email 'bot@alphacrm.app'
          git add data/ cloud_crm_data.json
          if git diff --staged --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Auto-update: Daily Market Briefing $(date +'%Y-%m-%d %H:%M') KST"
            git push origin main
          fi
